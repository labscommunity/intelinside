name: Validate and ingest result files and custom runtimes

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited, closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to recheck, or ingest if already merged'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: result-ingestion-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  results:
    if: github.repository == 'labscommunity/intelinside'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Privileged workflow: NEVER check out the PR head or run its scripts/config/dependencies.
      # Even manual retries use trusted code from the repository's default branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix frontend --ignore-scripts
      - name: Validate or ingest the immutable PR submission files
        run: node frontend/scripts/pr-results.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: ${{ vars.SITE_URL || 'https://intelinside-blond.vercel.app' }}
